components:
    schemas:
        Cart:
            properties:
                productId:
                    type: string
                quantity:
                    type: integer
            type: object
        Order:
            properties:
                cart:
                    $ref: '#/components/schemas/Cart'
                customer:
                    properties:
                        address:
                            properties:
                                city:
                                    type: string
                                street:
                                    type: string
                                zipcode:
                                    type: string
                            type: object
                        email:
                            format: email
                            type: string
                        name:
                            type: string
                    required:
                        - name
                    type: object
                payment:
                    $ref: '#/components/schemas/Payment'
            required:
                - cart
                - payment
                - customer
            type: object
        OrderResponse:
            properties:
                message:
                    type: string
                orderId:
                    type: string
                success:
                    type: boolean
            type: object
        Payment:
            properties:
                amount:
                    type: number
                method:
                    enum:
                        - credit_card
                        - paypal
                        - bank_transfer
                    type: string
            type: object
server:
    name: tehila_test_28_09_1
    x-disable-ssl: true
